<h2 mat-dialog-title>{{ modoEdicion ? 'Editar Colaborador' : 'Nuevo Colaborador' }}</h2>

<mat-dialog-content>
  <form [formGroup]="formColaborador" class="formulario-grid">
    
    <mat-form-field appearance="outline">
      <mat-label>Nombre</mat-label>
      <input matInput formControlName="nombre">
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Apellido</mat-label>
      <input matInput formControlName="apellido">
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Dirección</mat-label>
      <input matInput formControlName="direccion">
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Edad</mat-label>
      <input matInput type="number" formControlName="edad" min="18">
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Profesión</mat-label>
      <input matInput formControlName="profesion">
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Estado Civil</mat-label>
      <input matInput formControlName="estado_civil">
    </mat-form-field>

  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-flat-button (click)="cancelar()">Cancelar</button>
  
  <button mat-flat-button color="primary" [disabled]="formColaborador.invalid" (click)="guardar()">
    {{ modoEdicion ? 'Actualizar' : 'Crear' }}
  </button>
</mat-dialog-actions>
